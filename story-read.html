<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reading — Inverted Spectrum</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/story-pages.css">
  <link rel="stylesheet" href="./css/story-articles.css">
  <script src="./js/story-articles.js" defer></script>
</head>
<body class="story-detail-page" data-page="read">
  <header class="site-header">
    <a class="logo" href="./index.html#home">Inverted Spectrum</a>
    <a class="story-header-back" id="headerBack" href="./index.html#story">BACK <span class="story-icon story-icon-up" aria-hidden="true"></span></a>
  </header>
  <main class="article-shell article-reader">
    <p class="article-kicker" id="readingKicker">MAIN STORY</p>
    <h1 id="readingTitle">讀取中…</h1>
    <p class="article-subtitle" id="readingDate" hidden></p>
    <div class="article-rule"></div>
    <article class="article-content" id="readingContent"></article>
    <p class="article-empty" id="articleStatus" role="status" hidden></p>
    <nav class="article-pager" aria-label="文章導覽">
      <a id="previousArticle" hidden><span class="story-icon story-icon-left" aria-hidden="true"></span> 上一篇</a>
      <a id="nextArticle" hidden>下一篇 <span class="story-icon story-icon-right" aria-hidden="true"></span></a>
    </nav>
    <a class="article-return" id="backToCategory" href="./story-category.html?id=modern&category=excerpt"><span class="story-icon story-icon-left" aria-hidden="true"></span> 返回文章目錄</a>
  </main>
</body>
</html>
